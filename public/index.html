<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마음 한 걸음</title>
<meta name="description" content="가볍게 운동하고, 마음을 나누고, 산책하며 보물을 찾는 사회성 재활 게임">
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121118" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="마음한걸음">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="appbar" id="appbar">
  <div class="appbar-in">
    <div class="who">
      <span class="lv" id="abLv">Lv.1</span>
      <b id="abName">마음 한 걸음</b>
    </div>
    <span class="gold-chip"><i class="coin"></i><span id="abGold">0</span></span>
  </div>
  <div class="xp" title="경험치"><div class="bar"><i id="xp"></i></div><span id="xpt"></span></div>
  <span class="pv-flag">👀 미리보기 중</span>
</header>

<main class="main" id="main"></main>

<nav class="tabbar" aria-label="주요 메뉴">
  <button data-tab="mission" onclick="go('mission')"><svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-5.5h-6v5.5H5.5A1.5 1.5 0 0 1 4 19z"/></svg><span>홈</span></button>
  <button data-tab="map" onclick="go('map')"><svg viewBox="0 0 24 24"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.4"/></svg><span>보물 지도</span></button>
  <button data-tab="avatar" onclick="go('avatar')"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg><span>캐릭터</span></button>
  <button data-tab="shop" onclick="go('shop')"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1.2 11.1A1.6 1.6 0 0 1 16.2 20.5H7.8a1.6 1.6 0 0 1-1.6-1.4z"/><path d="M9 10V7a3 3 0 0 1 6 0v3"/></svg><span>상점</span></button>
  <button data-tab="rank" onclick="go('rank')"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5.5h2.5a2.5 2.5 0 0 1-3 3.4M7 5.5H4.5a2.5 2.5 0 0 0 3 3.4"/></svg><span>랭킹</span></button>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/character_parts/parts.js"></script>
<script src="/app.js"></script>
<script>
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(e=>console.warn('SW',e)))}
</script>
</body>
</html>
